# astronaut-light — the light variant of theme.conf (bright light / sun),
# same colours as ghostty/themes/astronaut-light. Generated from theme.conf.
# (colours from the wallpaper + the aqua-blue window glow).
# Sourced from tmux.conf. Pill caps   are Nerd Font glyphs; Ghostty
# draws them from its built-in symbols.
#
#  [ session ] 1 nvim  2 git              [PREFIX] [  folder ] [  branch ]

set -g status-position top
# a second, empty status row: a small gap between the pills and the text
set -g status 2
set -g status-format[1] ""
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=default fg=#6e6155"
set -g status-left-length 40
set -g status-right-length 120

# left: session name in emerald (Obsidian folders and links)
set -g status-left "#[fg=#1f6b5c bg=default]#[fg=#f8f1e3 bg=#1f6b5c bold] #S #[fg=#1f6b5c bg=default nobold] "

# windows: inactive = grey text, current = peach pill with ember number
# (like the active file in Obsidian)
set -g window-status-separator " "
set -g window-status-format "#[fg=#8f8276]#I #[fg=#6e6155]#W"
set -g window-status-current-format "#[fg=#f0c9a0 bg=default]#[fg=#b4541b bg=#f0c9a0 bold]#I #[fg=#2a1f1b]#W#{?window_zoomed_flag, 󰊓,}#[fg=#f0c9a0 bg=default nobold]"

# right: mode (PREFIX / COPY), current folder on a dark night card (like a
# code block in Obsidian), git branch as a tag (pine on mint)
set -g status-right "\
#{?client_prefix,#[fg=#b4541b bg=default]#[fg=#f1ead8 bg=#b4541b bold] PREFIX #[fg=#b4541b bg=default nobold] ,}\
#{?pane_in_mode,#[fg=#8c6a12 bg=default]#[fg=#f8f1e3 bg=#8c6a12 bold] COPY #[fg=#8c6a12 bg=default nobold] ,}\
#[fg=#1c1513 bg=default]#[fg=#e3dccb bg=#1c1513] #[fg=#c49a3a] #[fg=#e3dccb]#{b:pane_current_path} #[fg=#1c1513 bg=default nobold]\
#(~/.config/tmux/git-branch.sh '#{pane_current_path}' '#cfe3d6' '#134b40')"

# panes: active border = the aqua window glow (a line: a light colour is fine)
set -g pane-border-lines single
set -g pane-border-style "fg=#d6c8ab"
set -g pane-active-border-style "fg=#7daea3"

# messages, command prompt, copy-mode selection, clock
set -g message-style "bg=#e6dcc6 fg=#2a1f1b"
set -g message-command-style "bg=#e6dcc6 fg=#b4541b"
set -g mode-style "bg=#f1d4b9 fg=#2a1f1b"
setw -g clock-mode-colour "#1f6b5c"

# terminal title: host:window
set -g set-titles on
set -g set-titles-string '#h:#W'
