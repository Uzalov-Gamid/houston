# astronaut-light — the light variant of theme.conf (bright light / sun),
# same colours as ghostty/themes/astronaut-light. Generated from theme.conf.
# (colours from the wallpaper + the aqua-blue window glow).
# Sourced from tmux.conf. Pill caps   are Nerd Font glyphs; Ghostty
# draws them from its built-in symbols.
#
#  [ session ] 1 nvim  2 git              [PREFIX] [  folder ] [  branch ]

set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=default fg=#76695d"
set -g status-left-length 40
set -g status-right-length 120

# left: session name in the main accent (blue = window glow)
set -g status-left "#[fg=#2b6b60 bg=default]#[fg=#f1ead8 bg=#2b6b60 bold] #S #[fg=#2b6b60 bg=default nobold] "

# windows: inactive = grey text, current = dark pill with orange number
set -g window-status-separator " "
set -g window-status-format "#[fg=#a18f80]#I #[fg=#76695d]#W"
set -g window-status-current-format "#[fg=#d6c8ab bg=default]#[fg=#b4541b bg=#d6c8ab bold]#I #[fg=#2a1f1b]#W#{?window_zoomed_flag, 󰊓,}#[fg=#d6c8ab bg=default nobold]"

# right: mode (PREFIX / COPY), current folder, git branch of that folder
set -g status-right "\
#{?client_prefix,#[fg=#b4541b bg=default]#[fg=#f1ead8 bg=#b4541b bold] PREFIX #[fg=#b4541b bg=default nobold] ,}\
#{?pane_in_mode,#[fg=#876100 bg=default]#[fg=#f1ead8 bg=#876100 bold] COPY #[fg=#876100 bg=default nobold] ,}\
#[fg=#e6dcc6 bg=default]#[fg=#2a1f1b bg=#e6dcc6] #[fg=#3d5878] #[fg=#2a1f1b]#{b:pane_current_path} #[fg=#e6dcc6 bg=default nobold]\
#(~/.config/tmux/git-branch.sh '#{pane_current_path}' '#e6dcc6' '#5d6a1c')"

# panes: active border = window-glow blue
set -g pane-border-lines single
set -g pane-border-style "fg=#d6c8ab"
set -g pane-active-border-style "fg=#2b6b60"

# messages, command prompt, copy-mode selection, clock
set -g message-style "bg=#e6dcc6 fg=#2a1f1b"
set -g message-command-style "bg=#e6dcc6 fg=#b4541b"
set -g mode-style "bg=#d6c8ab fg=#2a1f1b"
setw -g clock-mode-colour "#2b6b60"

# terminal title: host:window
set -g set-titles on
set -g set-titles-string '#h:#W'
