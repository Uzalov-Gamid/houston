# Match the status surface and mode marker in Neovim.
set -g status-position top
set -g status on
set -g status-justify left
set -g status-interval 5
set -g status-style 'bg=#2a1f1b,fg=#a9998b'
set -g status-left-length 24
set -g status-right-length 65
set -g status-left '#[fg=#1c1513,bg=#e3b590,bold] #S #[default]  '
set -g window-status-separator '   '
set -g window-status-format '#[fg=#a9998b]#I #W'
set -g window-status-current-format '#[fg=#e3b590,bold]#I #W#{?window_zoomed_flag, ↗,}#[nobold]'
set -g window-status-activity-style 'fg=#7daea3'
set -g status-right '#{?client_prefix,#[fg=#ef8f4c bold] PREFIX ,}#{?pane_in_mode,#[fg=#e5c15a bold] COPY ,}#[fg=#a9998b nobold]#{b:pane_current_path}  '
set -g pane-border-lines single
set -g pane-border-style 'fg=#59473e'
set -g pane-active-border-style 'fg=#7daea3'
set -g message-style 'bg=#2a1f1b,fg=#f1ead8'
set -g message-command-style 'bg=#2a1f1b,fg=#ef8f4c'
set -g mode-style 'bg=#334741,fg=#f1e8dc'
setw -g clock-mode-colour '#7daea3'
