# style name or JSON path (default "auto")
# light terminal (Ghostty astronaut-light); dark: ~/.config/glow/astronaut.json
style: "~/.config/glow/astronaut-light.json"
# mouse support (TUI-mode only)
mouse: false
# use pager to display markdown
pager: false
# word-wrap at width
width: 80
# show all files, including hidden and ignored.
all: false
