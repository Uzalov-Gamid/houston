# sqlfluff on save (after/ftplugin/sql.lua): only layout and keyword case,
# the query itself is never rewritten. Several columns stay on one line.
[sqlfluff]
dialect = postgres
max_line_length = 80
rules = layout, capitalisation.keywords
exclude_rules = layout.select_targets

[sqlfluff:rules:capitalisation.keywords]
capitalisation_policy = upper

[sqlfluff:indentation]
indent_unit = space
tab_space_size = 2
